name: Release

# Publica uma versão nova quando pack/manifest.json muda de versão.
# Toda a lógica fica em tools/release.sh (o mesmo script roda no PC).

on:
  push:
    branches: [main]
    paths:
      - pack/manifest.json
  workflow_dispatch:
    inputs:
      skip_curseforge:
        description: Não enviar para o CurseForge (só GitHub Release)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID || '1801989' }}
          CF_RELEASE_TYPE: ${{ vars.CF_RELEASE_TYPE || 'beta' }}
        run: tools/release.sh ${{ inputs.skip_curseforge && '--skip-curseforge' || '' }}
