	guardingEnabled = true
	#Enable the Counterguard enchantment's effects.
	counterguardEnabled = true
	#Enable the Undertow enchantment's effects.
	undertowEnabled = true

[effects]
	#Global effect scale; each mechanic still enforces its own safety cap.
	# Default: 1.0
	# Range: 0.0 ~ 2.0
	strength = 1.0
	#Base chance for chance-based effects; each effect applies its own level scaling.
	# Default: 0.12
	# Range: 0.0 ~ 1.0
	chance = 0.12
	# Default: 100
	# Range: 1 ~ 72000
	cooldownTicks = 100
	# Default: 6
	# Range: 1 ~ 16
	entitySearchRadius = 6
	# Default: 64
	# Range: 1 ~ 128
	connectedBlockCap = 64
	#Require sneaking to activate Lumberjack; disabling this makes log harvesting automatic.
	lumberjackRequiresSneaking = true
	#Allow player-versus-player effects.
	enablePvP = false
