	#Enable the Endurance enchantment's effects.
	enduranceEnabled = true
	#Enable the Trailblazer enchantment's effects.
	trailblazerEnabled = true
	#Enable the Wall Grip enchantment's effects.
	wall_gripEnabled = true
	#Enable the Deep Lungs enchantment's effects.
	deep_lungsEnabled = true
	#Enable the Nightwalker enchantment's effects.
	nightwalkerEnabled = true
	#Enable the Glider enchantment's effects.
	gliderEnabled = true
	#Enable the Soft Landing enchantment's effects.
	soft_landingEnabled = true
	#Enable the Deepwater Bait enchantment's effects.
	deepwater_baitEnabled = true
	#Enable the Treasure Seeker enchantment's effects.
	treasure_seekerEnabled = true
	#Enable the Firm Line enchantment's effects.
