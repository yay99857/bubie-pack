	#Enable the Steadfast enchantment's effects.
	steadfastEnabled = true
	#Enable the Vitality enchantment's effects.
	vitalityEnabled = true
	#Enable the Recovery enchantment's effects.
	recoveryEnabled = true
	#Enable the Featherstep enchantment's effects.
	featherstepEnabled = true
	#Enable the Surefooted enchantment's effects.
	surefootedEnabled = true
	#Enable the Vein Miner enchantment's effects.
	vein_minerEnabled = true
	#Enable the Auto Smelt enchantment's effects.
	auto_smeltEnabled = true
	#Enable the Magnetism enchantment's effects.
	magnetismEnabled = true
	#Enable the Replenish enchantment's effects.
	replenishEnabled = true
