# Bubie Pack: o carregamento sem fio do Flux Controller não carrega itens de voo/armadura de energia.
# Sem isso, um Controller ligado num gerador dá energia infinita ao jetpack em qualquer dimensão (inclusive no Nether).
# As redes continuam funcionando normalmente para máquinas (Plugs e Points), inclusive entre dimensões.

[blacklist]
	#A blacklist for blocks which flux devices shouldn't connect to, use format 'modid:registry_name'
	blockBlacklistStrings = ["actuallyadditions:block_phantom_energyface"]
	#A blacklist for items which wireless charging shouldn't charge to, use format 'modid:registry_name'
	itemBlackListStrings = ["ironjetpacks:jetpack", "mekanism:mekasuit_helmet", "mekanism:mekasuit_bodyarmor", "mekanism:mekasuit_pants", "mekanism:mekasuit_boots"]
